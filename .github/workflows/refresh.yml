name: Refresh NSE price history

on:
  schedule:
    # GitHub has been starting these ~5.5 h late, so don't rely on the morning slot.
    # Main run: 10:37 UTC = 16:07 IST, after the close. Even hours late it lands
    # before the next 08:00 IST analysis run. Odd minutes avoid the busy :00/:15 slots.
    - cron: "37 10 * * 1-5"
    # Backup: 00:47 UTC = 06:17 IST, picks up anything the evening run missed.
    - cron: "47 0 * * 2-6"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/refresh.yml"
      - "requirements.txt"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Download prices and compute indicators
        run: python scripts/fetch_nse.py

      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "data: refresh $(date -u +%Y-%m-%d)"
            git pull --rebase origin main
            git push
          fi
